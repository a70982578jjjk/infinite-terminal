<style>

.cyber-panel {

    --bg-color: #050505;
    --border-color: #222222;

    --text-main: #d1d5db;
    --text-muted: #666666;

    --accent-red: #ff2a2a;
    --accent-dark: #3a0a0a;

    width: 100%;
    max-width: 520px;

    box-sizing: border-box;

    background:
        linear-gradient(
            rgba(5,5,5,0.98),
            rgba(5,5,5,0.98)
        );

    border:
        1px solid
        var(--border-color);

    padding: 18px;

    font-family:
        'Fira Code',
        'Courier New',
        monospace;

    color:
        var(--text-main);

    box-shadow:
        0 0 30px
        rgba(0,0,0,0.9);

    position: relative;

    overflow: hidden;

}


.cyber-panel::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            rgba(18,16,16,0)
            50%,
            rgba(0,0,0,0.25)
            50%
        ),

        linear-gradient(
            90deg,
            rgba(255,0,0,0.05),
            rgba(0,255,0,0.02),
            rgba(0,0,255,0.05)
        );

    background-size:
        100% 4px,
        3px 100%;

    pointer-events: none;

    z-index: 10;

}


.cyber-header {

    color:
        var(--accent-red);

    font-size: 15px;

    font-weight: 900;

    letter-spacing: 2px;

    text-shadow:
        0 0 8px
        rgba(255,42,42,0.5);

    margin-top: 14px;

    margin-bottom: 10px;

}


.cyber-header::before {

    content: ">> ";

}


.cyber-divider {

    border-top:
        1px dashed
        var(--accent-red);

    opacity: 0.5;

    margin:
        10px 0 15px;

}


.cyber-list {

    display:
        flex;

    flex-direction:
        column;

    gap: 8px;

    margin-bottom:
        20px;

}


.cyber-item {

    display:
        flex;

    background:
        #0a0a0a;

    border:
        1px solid
        var(--border-color);

    position:
        relative;

    transition:
        0.18s ease;

}


.cyber-item:hover {

    border-color:
        rgba(255,42,42,0.45);

}


.cyber-item-label {

    width:
        82px;

    min-width:
        82px;

    padding:
        10px;

    box-sizing:
        border-box;

    border-left:
        4px solid
        var(--accent-red);

    border-right:
        1px solid
        var(--border-color);

    color:
        var(--text-muted);

    font-size:
        12px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

}


.cyber-item-value {

    flex:
        1;

    min-width:
        0;

    padding:
        10px;

    font-size:
        13px;

    color:
        var(--text-main);

    line-height:
        1.6;

    word-break:
        break-word;

}


.cyber-emoji {

    font-size:
        22px;

    font-weight:
        bold;

    color:
        var(--accent-red);

    text-shadow:
        0 0 10px
        rgba(255,42,42,0.4);

}


.cyber-alert-box {

    border:
        1px solid
        var(--accent-red);

    background:
        var(--accent-dark);

    padding:
        14px;

    text-align:
        center;

    margin-bottom:
        20px;

}


.cyber-alert-title {

    color:
        var(--accent-red);

    font-size:
        14px;

    font-weight:
        bold;

    letter-spacing:
        1px;

    margin-bottom:
        8px;

}


.cyber-meta {

    color:
        #777;

    font-size:
        10px;

    line-height:
        1.7;

}


.cyber-meta span {

    color:
        #aaa;

}


.quest-title {

    font-weight:
        bold;

    font-size:
        14px;

    margin-bottom:
        6px;

}


.quest-detail {

    color:
        #999;

    margin-bottom:
        8px;

}


.quest-reward {

    color:
        #d4af37;

    font-size:
        11px;

    margin-bottom:
        10px;

}


.quest-footer {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        8px;

    flex-wrap:
        wrap;

}


.quest-status {

    color:
        #777;

    font-size:
        9px;

    letter-spacing:
        1px;

}


.quest-strike {

    opacity:
        0.65;

}


.quest-strike
.quest-title {

    text-decoration:
        line-through;

}


.cyber-btn {

    background:
        transparent;

    border:
        1px solid
        var(--text-muted);

    color:
        var(--text-main);

    padding:
        5px 10px;

    font-family:
        inherit;

    font-size:
        11px;

    cursor:
        pointer;

    transition:
        all 0.2s ease;

}


.cyber-btn::before {

    content:
        "[ ";

    color:
        var(--text-muted);

}


.cyber-btn::after {

    content:
        " ]";

    color:
        var(--text-muted);

}


.cyber-btn:hover {

    border-color:
        var(--accent-red);

    color:
        var(--bg-color);

    background:
        var(--accent-red);

    box-shadow:
        0 0 10px
        rgba(255,42,42,0.4);

}


.shop-top {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;

    margin-bottom:
        7px;

}


.shop-name {

    font-weight:
        bold;

}


.highlight {

    color:
        var(--accent-red);

    font-weight:
        bold;

    white-space:
        nowrap;

}


.shop-description {

    color:
        #999;

    margin-bottom:
        12px;

}


.shop-actions {

    display:
        flex;

    justify-content:
        flex-end;

    align-items:
        center;

    gap:
        10px;

}


.qty-ctrl {

    display:
        flex;

    align-items:
        center;

    border:
        1px solid
        var(--border-color);

}


.qty-btn {

    background:
        transparent;

    border:
        0;

    color:
        var(--accent-red);

    padding:
        5px 9px;

    cursor:
        pointer;

    font-weight:
        bold;

}


.qty-btn:hover {

    background:
        rgba(255,42,42,0.1);

}


.qty-val {

    padding:
        0 12px;

    color:
        var(--text-main);

    font-size:
        12px;

    min-width:
        15px;

    text-align:
        center;

    border-left:
        1px solid
        var(--border-color);

    border-right:
        1px solid
        var(--border-color);

}


.inventory-list {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        8px;

}


.cyber-bag-item {

    cursor:
        pointer;

}


.cyber-bag-item:hover {

    background:
        rgba(255,42,42,0.08);

    border-color:
        var(--accent-red);

}


.inventory-mark {

    width:
        8px;

    min-width:
        8px;

    padding:
        0;

    border-left-width:
        2px;

}


.inventory-detail {

    color:
        #666;

}


.cyber-empty {

    border:
        1px dashed
        #292929;

    padding:
        16px;

    color:
        #555;

    text-align:
        center;

    font-size:
        11px;

}


.system-code {

    color:
        #666;

    font-size:
        10px;

    display:
        block;

    margin-bottom:
        5px;

}


#infinite-terminal-close {

    position:
        absolute;

    top:
        10px;

    right:
        10px;

    width:
        32px;

    height:
        32px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        0;

    border-radius:
        50%;

    background:
        rgba(12,14,20,0.9);

    border:
        1px solid
        rgba(210,220,235,0.4);

    color:
        #ddd;

    font-size:
        19px;

    cursor:
        pointer;

    z-index:
        2147483647;

}


#infinite-terminal-close:hover {

    background:
        rgba(255,42,42,0.8);

    color:
        white;

    border-color:
        white;

}


#infinite-terminal-container {

    position:
        fixed;

    top:
        60px;

    right:
        20px;

    width:
        min(540px, calc(100vw - 30px));

    max-height:
        calc(100vh - 90px);

    overflow-y:
        auto;

    overflow-x:
        hidden;

    z-index:
        2000000 !important;

    pointer-events:
        auto;

}


#floating-terminal-btn {

    position:
        fixed;

    width:
        124px;

    height:
        44px;

    box-sizing:
        border-box;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        8px;

    border-radius:
        14px;

    background:
        linear-gradient(
            135deg,
            rgba(28,34,46,0.96),
            rgba(10,13,19,0.96)
        );

    border:
        1px solid
        rgba(215,225,240,0.38);

    color:
        rgba(235,241,250,0.94);

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size:
        14px;

    font-weight:
        600;

    letter-spacing:
        1.5px;

    cursor:
        grab;

    user-select:
        none;

    -webkit-user-select:
        none;

    touch-action:
        none;

    z-index:
        2147483647 !important;

    pointer-events:
        auto !important;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,0.5),

        0 0 18px
        rgba(150,180,220,0.1),

        inset 0 1px 0
        rgba(255,255,255,0.12);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease;

}


#floating-terminal-btn:hover {

    transform:
        translateY(-2px);

    border-color:
        rgba(225,235,250,0.62);

    box-shadow:
        0 12px 36px
        rgba(0,0,0,0.55),

        0 0 22px
        rgba(170,200,240,0.14);

}


.floating-dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        rgba(205,225,255,0.95);

    box-shadow:
        0 0 8px
        rgba(190,220,255,0.85);

}


.terminal-setting-title {

    font-weight:
        bold;

    margin:
        10px 0 8px;

}


.terminal-setting-help {

    opacity:
        0.75;

    font-size:
        12px;

    line-height:
        1.6;

    margin-bottom:
        10px;

}


#infinite-terminal-instruction {

    width:
        100%;

    min-height:
        360px;

    resize:
        vertical;

    box-sizing:
        border-box;

    padding:
        10px;

    border-radius:
        8px;

    font-family:
        monospace;

    line-height:
        1.5;

    background:
        rgba(0,0,0,0.15);

    color:
        var(--SmartThemeBodyColor);

    border:
        1px solid
        var(--SmartThemeBorderColor);

}


#infinite-terminal-save-instruction,
#infinite-terminal-clear-state {

    width:
        100%;

    margin-top:
        10px;

}


#infinite-terminal-save-status {

    margin-top:
        8px;

    font-size:
        12px;

    opacity:
        0.7;

    text-align:
        center;

}


#terminal-sync-status {

    display:
        block;

    margin-top:
        7px;

    color:
        #777;

    font-size:
        9px;

    letter-spacing:
        1px;

}


@media (
    max-width: 600px
) {

    #infinite-terminal-container {

        top:
            12px;

        right:
            8px;

        width:
            calc(100vw - 16px);

        max-height:
            calc(100vh - 24px);

    }


    .inventory-list {

        grid-template-columns:
            1fr;

    }


    .cyber-panel {

        padding:
            12px;

    }

}

</style>


<div class="cyber-panel">


    <div class="cyber-alert-box">

        <div class="cyber-alert-title">

            ABSOLUTE TOP SECRET // 绝密档案

        </div>


        <div class="cyber-meta">

            [ID]:
            <span id="terminal-meta-id">
                WAITING
            </span>


            &nbsp;&nbsp;


            [LOC]:
            <span id="terminal-meta-location">
                等待剧情同步
            </span>


            &nbsp;&nbsp;


            [TIME]:
            <span id="terminal-meta-time">
                --:--:--
            </span>


            <span
                id="terminal-sync-status"
            >
                ● 等待 AI 同步
            </span>

        </div>

    </div>


    <div class="cyber-header">

        SYSTEM_LOGS

    </div>


    <div class="cyber-divider"></div>


    <div
        id="terminal-commentary-list"
        class="cyber-list"
    >

        <div class="cyber-item">

            <div class="cyber-item-label">

                <span
                    id="terminal-mood"
                    class="cyber-emoji"
                >

                    ◎

                </span>

            </div>


            <div class="cyber-item-value">

                <span class="system-code">

                    SYS // WAITING

                </span>


                等待 AI 生成第一份终端状态……

            </div>

        </div>

    </div>


    <div class="cyber-header">

        QUEST_TERMINAL

    </div>


    <div class="cyber-divider"></div>


    <div
        id="terminal-main-quests"
        class="cyber-list"
    >

        <div class="cyber-empty">

            [ NO ACTIVE MAIN QUEST ]

        </div>

    </div>


    <div class="cyber-header">

        SIDE_QUESTS

    </div>


    <div class="cyber-divider"></div>


    <div
        id="terminal-side-quests"
        class="cyber-list"
    >

        <div class="cyber-empty">

            [ NO ACTIVE SIDE QUEST ]

        </div>

    </div>


    <div class="cyber-header">

        DARK_MARKET

    </div>


    <div class="cyber-divider"></div>


    <div
        id="terminal-shop-list"
        class="cyber-list"
    >

        <div class="cyber-empty">

            [ SHOP DATA NOT SYNCED ]

        </div>

    </div>


    <div class="cyber-header">

        INVENTORY

    </div>


    <div class="cyber-divider"></div>


    <div
        id="terminal-inventory-list"
        class="cyber-list inventory-list"
    >

        <div class="cyber-empty">

            [ INVENTORY EMPTY ]

        </div>

    </div>


</div>
